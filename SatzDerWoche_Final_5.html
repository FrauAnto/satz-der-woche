<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satz der Woche</title>
<style>
:root{--ink:#1a1a2e;--paper:#fafaf7;--blue:#1565c0;--blue-lt:#e8f0fb;--green:#2e7d32;--green-lt:#e8f5e9;--teal:#00695c;--teal-lt:#e0f2f1;--orange:#e65100;--orange-lt:#fff3e0;--purple:#6a1b9a;--purple-lt:#f3e5f5;--grey:#f0eff0;--border:#d0cfc8;--muted:#757575;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px}
#tp{background:#1a1a2e;color:#fff}
#tp-toggle{width:100%;background:none;border:none;color:#aaa;font-size:12px;padding:8px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px}
#tp-toggle:hover{color:#fff}
#tp-form{display:none;padding:16px;gap:12px;flex-wrap:wrap;background:#16213e;border-bottom:2px solid #e65100}
#tp-form.open{display:flex}
.ts{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#e65100;font-weight:700;padding-bottom:4px;border-bottom:1px solid #333;margin-bottom:4px;margin-top:8px}
.tf{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.tf label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
.tf input{background:#1a1a2e;border:1px solid #444;color:#fff;border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit}
.tr{display:flex;gap:12px;flex-wrap:wrap;width:100%}
#tp-save{align-self:flex-end;background:#e65100;color:#fff;border:none;border-radius:8px;padding:10px 22px;cursor:pointer;font-weight:700;font-size:13px;margin-top:8px}
header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.app-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
#kw-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-lt);border-radius:20px;padding:4px 12px;margin-top:2px;width:fit-content}
.day-tabs{display:flex;gap:4px;flex-wrap:wrap}
.day-tab{padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;border:2px solid transparent;cursor:pointer;background:var(--grey);color:var(--muted);transition:all .15s}
.day-tab[data-d="0"].active{color:var(--blue);background:var(--blue-lt);border-color:var(--blue)}
.day-tab[data-d="1"].active{color:var(--green);background:var(--green-lt);border-color:var(--green)}
.day-tab[data-d="2"].active{color:var(--teal);background:var(--teal-lt);border-color:var(--teal)}
.day-tab[data-d="3"].active{color:var(--orange);background:var(--orange-lt);border-color:var(--orange)}
.day-tab[data-d="4"].active{color:var(--purple);background:var(--purple-lt);border-color:var(--purple)}
#satz-banner{margin:16px 20px;background:var(--blue-lt);border:1.5px solid var(--blue);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.banner-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);font-weight:700;margin-bottom:6px}
.banner-satz{font-size:16px;line-height:1.6;flex:1;min-width:200px}
.banner-satz .zw{font-weight:800;color:var(--orange);background:#fff3e0;border-radius:4px;padding:1px 5px}
.banner-meta{display:flex;flex-direction:column;gap:6px}
.meta-chip{display:inline-flex;flex-direction:column;padding:6px 12px;border-radius:8px;font-size:12px}
.meta-chip span:first-child{font-size:10px;color:var(--muted);text-transform:uppercase}
.meta-chip span:last-child{font-weight:800;font-size:14px}
.chip-word{background:var(--orange-lt)}.chip-word span:last-child{color:var(--orange)}
.chip-art{background:var(--purple-lt)}.chip-art span:last-child{color:var(--purple)}
#name-bar{margin:0 20px 14px;display:flex;align-items:center;gap:10px}
#name-bar label{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
#name-input{border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;outline:none;width:240px;transition:border-color .15s}
#name-input:focus{border-color:var(--blue)}
main{padding:0 20px 28px}
.task-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-head{padding:14px 18px;display:flex;align-items:center;gap:10px}
.card-emoji{font-size:22px}.card-title{font-size:16px;font-weight:700}.card-sub{font-size:12px;color:var(--muted);margin-top:2px}
.card-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.task-prompt{background:var(--grey);border-radius:8px;padding:13px 15px;font-size:14px;line-height:1.7;white-space:pre-line}
.task-hint{font-size:12px;color:var(--muted);font-style:italic;padding:5px 12px;border-left:3px solid var(--border)}
.friday-blank{font-family:'Courier New',monospace;font-size:13px;color:var(--muted);background:var(--purple-lt);border-radius:8px;padding:10px 14px}
textarea{width:100%;border:2px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;resize:vertical;min-height:90px;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--blue)}
.submit-btn{align-self:flex-start;padding:11px 24px;border-radius:8px;border:none;font-weight:700;font-size:14px;cursor:pointer;color:#fff;transition:opacity .15s}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.btn-0{background:var(--blue)}.btn-1{background:var(--green)}.btn-2{background:var(--teal)}.btn-3{background:var(--orange)}.btn-4{background:var(--purple)}
.fb-box{margin-top:4px;border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.8;border-left:4px solid;display:none}
.fb-box.vis{display:block}
.fb-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}
.fb-0{background:var(--blue-lt);border-color:var(--blue)}.fb-0 .fb-label{color:var(--blue)}
.fb-1{background:var(--green-lt);border-color:var(--green)}.fb-1 .fb-label{color:var(--green)}
.fb-2{background:var(--teal-lt);border-color:var(--teal)}.fb-2 .fb-label{color:var(--teal)}
.fb-3{background:var(--orange-lt);border-color:var(--orange)}.fb-3 .fb-label{color:var(--orange)}
.fb-4{background:var(--purple-lt);border-color:var(--purple)}.fb-4 .fb-label{color:var(--purple)}
.stempel-box{border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.6;border-left:4px solid var(--orange);background:var(--orange-lt);display:none}
.stempel-box.vis{display:block}
.stempel-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--orange);margin-bottom:4px}
.def-box{background:var(--blue-lt);border:1.5px solid var(--blue);border-radius:var(--radius);padding:14px 16px;font-size:14px;line-height:1.8}
.def-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--blue);margin-bottom:8px}
.mc-section{display:flex;flex-direction:column;gap:12px}
.mc-q{background:var(--grey);border-radius:10px;padding:14px 16px}
.mc-q-text{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.5}
.mc-opts{display:flex;flex-direction:column;gap:6px}
.mc-opt-btn{padding:9px 14px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:13px;text-align:left;cursor:pointer;font-family:inherit;transition:all .15s}
.mc-opt-btn:hover:not(:disabled){border-color:var(--blue);background:var(--blue-lt)}
.mc-opt-btn.correct{border-color:var(--green)!important;background:var(--green-lt)!important;font-weight:700}
.mc-opt-btn.wrong{border-color:#c62828!important;background:#ffebee!important}
.mc-result{font-size:12px;margin-top:6px;font-weight:600;display:none}
.mc-result.vis{display:block}
.loading-box{color:var(--muted);font-style:italic;font-size:13px;padding:12px 0}
.saved-note{font-size:12px;color:var(--green);font-weight:600;display:none;align-items:center;gap:4px}
.saved-note.vis{display:flex}
.day-0 .card-head{background:var(--blue-lt);border-bottom:1.5px solid var(--blue)}.day-0.task-card{border-color:var(--blue)}
.day-1 .card-head{background:var(--green-lt);border-bottom:1.5px solid var(--green)}.day-1.task-card{border-color:var(--green)}
.day-2 .card-head{background:var(--teal-lt);border-bottom:1.5px solid var(--teal)}.day-2.task-card{border-color:var(--teal)}
.day-3 .card-head{background:var(--orange-lt);border-bottom:1.5px solid var(--orange)}.day-3.task-card{border-color:var(--orange)}
.day-4 .card-head{background:var(--purple-lt);border-bottom:1.5px solid var(--purple)}.day-4.task-card{border-color:var(--purple)}
footer{text-align:center;padding:14px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<div id="tp">
  <button id="tp-toggle" onclick="toggleT()">⚙️ Lehrperson-Einstellungen &nbsp;▾</button>
  <div id="tp-form">
    <div class="ts" style="margin-top:0">📊 Google Sheets – Script-URL</div>
    <div style="font-size:11px;color:#aaa;width:100%;margin-bottom:4px">Die Wocheninhalte werden automatisch aus dem «Wochen»-Tabellenblatt geladen.</div>
    <div class="tr">
      <div class="tf"><label>Web-App URL (Apps Script)</label><input id="t-script" type="text" value="https://script.google.com/macros/s/AKfycbxpdiHi6o-lTurMSqGJN_y4cR-1defrHLzkDJqCM_QnK8TsLxvxeNGwlyDrtCE2jTprhg/exec"></div>
    </div>
    <button id="tp-save" onclick="saveT()">💾 Speichern</button>
  </div>
</div>

<header>
  <div>
    <div class="app-eyebrow">Satz der Woche</div>
    <div id="kw-badge" class="kw-badge">📅 Wird geladen...</div>
  </div>
  <div class="day-tabs" id="day-tabs"></div>
</header>

<div id="satz-banner">
  <div style="flex:1;min-width:200px">
    <div class="banner-label">✦ Unser Satz diese Woche</div>
    <div class="banner-satz" id="banner-satz"><span style="color:var(--muted);font-style:italic;font-size:13px">Wird geladen...</span></div>
  </div>
  <div class="banner-meta">
    <div class="meta-chip chip-word"><span>Zielwort</span><span id="chip-wort">—</span></div>
    <div class="meta-chip chip-art"><span>Wortart</span><span id="chip-art">—</span></div>
  </div>
</div>

<div id="name-bar">
  <label for="name-input">👤 Dein Name:</label>
  <input id="name-input" type="text" placeholder="Vorname Nachname">
</div>

<main>
  <div class="task-card" id="task-card">
    <div class="card-head">
      <span class="card-emoji" id="card-emoji">⏳</span>
      <div><div class="card-title" id="card-title">Wird geladen...</div><div class="card-sub" id="card-sub"></div></div>
    </div>
    <div class="card-body" id="card-body"></div>
  </div>
</main>
<footer>Satz-der-Woche-Tool · Individuelles Lernen · 5 Min.</footer>

<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbxpdiHi6o-lTurMSqGJN_y4cR-1defrHLzkDJqCM_QnK8TsLxvxeNGwlyDrtCE2jTprhg/exec";
var W=null; // aktuelle Wochendaten
var currentDay=0;
var DN=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
var DE=["📖","✏️","🔍","🌐","🧠"];

function autoDay(){var d=new Date().getDay();return(d>=1&&d<=5)?d-1:0;}
function getKW(){
  var d=new Date(),j=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  j.setUTCDate(j.getUTCDate()+4-(j.getUTCDay()||7));
  var y=new Date(Date.UTC(j.getUTCFullYear(),0,1));
  return Math.ceil((((j-y)/86400000)+1)/7);
}

// ── WOCHENDATEN AUS SHEETS LADEN ──────────────────────────────────────────
async function loadWoche(){
  var kw=getKW();
  // Cache prüfen
  try{
    var cached=localStorage.getItem("sdw_woche_"+kw);
    if(cached){W=JSON.parse(cached);renderAll();return;}
  }catch(e){}

  try{
    var url=SCRIPT_URL+"?action=getWoche&kw="+kw;
    var resp=await fetch(url);
    var text=await resp.text();
    if(text&&text.trim()&&text.trim()!==""){
      W=JSON.parse(text);
      try{localStorage.setItem("sdw_woche_"+kw,JSON.stringify(W));}catch(e){}
      renderAll();
    } else {
      showError("Für KW "+kw+" wurde noch kein Inhalt eingetragen. Bitte trage die Woche im Google Sheets «Wochen»-Blatt ein.");
    }
  }catch(e){
    showError("Verbindung fehlgeschlagen. Bitte Seite neu laden.");
  }
}

function showError(msg){
  document.getElementById("kw-badge").textContent="⚠️ Fehler";
  document.getElementById("banner-satz").innerHTML="<span style='color:var(--muted);font-style:italic;font-size:13px'>"+msg+"</span>";
  document.getElementById("card-title").textContent="Fehler";
  document.getElementById("card-body").innerHTML="<div class='task-hint'>"+msg+"</div>";
}

// ── REGEL-FEEDBACK ────────────────────────────────────────────────────────
function getRuleFeedback(day,answer){
  if(!W)return "";
  var a=answer.trim(),aL=a.toLowerCase(),w=W.wort.toLowerCase();
  var vn=(document.getElementById("name-input").value.trim().split(" ")[0]||"");
  if(vn)vn=" "+vn;
  function hatW(t){return t.toLowerCase().indexOf(w.substring(0,Math.max(4,w.length-3)))!==-1;}
  function endet(t){return /[.!?]$/.test(t.trim());}
  function gross(t){return /^[A-ZÄÖÜ]/.test(t.trim());}
  function wanz(t){return t.trim().split(/\s+/).length;}
  var lobs=["Super gemacht"+vn+"! 🌟","Toll"+vn+"! 👍","Sehr gut"+vn+"! ✨","Gut gemacht"+vn+"! 🎉","Prima"+vn+"! 💪"];
  var lob=lobs[Math.floor(Math.random()*lobs.length)];

  if(day===1){
    if(!hatW(a))return "Du hast dir etwas überlegt – gut! Das Zielwort «"+W.wort+"» fehlt aber noch. Schreibe einen Satz und benutze darin das Wort «"+W.wort+"».";
    if(wanz(a)<4)return lob+" Das Zielwort ist da! Dein Satz könnte noch länger sein – schreibe einen vollständigen Satz.";
    var h=[];
    if(!gross(a))h.push("Beginne den Satz mit einem Grossbuchstaben.");
    if(!endet(a))h.push("Vergiss den Punkt am Ende nicht.");
    if(h.length)return lob+" Das Zielwort «"+W.wort+"» ist in deinem Satz! Noch ein Hinweis: "+h.join(" ");
    return lob+" Du hast das Zielwort «"+W.wort+"» richtig in einem eigenen Satz verwendet. Ausgezeichnet!";
  }
  if(day===2){
    if(W.art==="Verb"){
      var ff=["ich","du","er","sie","wir","ihr"],gef=0;
      ff.forEach(function(f){if(aL.indexOf(f)!==-1)gef++;});
      if(gef>=5)return lob+" Du hast viele Formen aufgeschrieben! Vergleiche sie nochmals mit dem Wörterbuch.";
      if(gef>=3)return lob+" Du hast "+gef+" Formen. Vervollständige: ich / du / er-sie / wir / ihr / sie – alle sechs!";
      return "Gut versucht"+vn+"! Schreibe alle sechs Formen:\nych __ / du __ / er/sie __ / wir __ / ihr __ / sie __";
    } else if(W.art==="Adjektiv"){
      var hk=aL.indexOf("er")!==-1,hs=aL.indexOf("am ")!==-1||aL.indexOf("sten")!==-1;
      if(hk&&hs)return lob+" Grundform, Komparativ und Superlativ sind da. Kontrolliere nochmals ob alle Formen stimmen!";
      return "Gut versucht"+vn+"! Schreibe: Grundform / Komparativ (+er) / Superlativ (am …sten).";
    } else {
      if(hatW(a)&&wanz(a)>2)return lob+" Du hast den Plural gebildet und einen Satz geschrieben. Vergleiche mit dem Wörterbuch!";
      if(wanz(a)<=2)return lob+" Der Plural ist da! Schreibe jetzt noch einen vollständigen Satz damit.";
      return "Gut versucht"+vn+"! Schreibe den Plural von «"+W.wort+"» und dann einen Satz damit.";
    }
  }
  if(day===3){
    var anz=a.split(/[\n,;]+/).filter(function(x){return x.trim().length>2;}).length;
    var erkl=a.indexOf("=")!==-1||a.indexOf("bedeutet")!==-1||a.length>40;
    if(anz>=1&&erkl)return lob+" Du hast verwandte Wörter gefunden und erklärt. Ausgezeichnet!";
    if(anz>=1)return lob+" Verwandte Wörter gefunden! Erkläre noch kurz was sie bedeuten.";
    return "Suche Wörter mit demselben Wortstamm wie «"+W.wort+"» und erkläre kurz was sie bedeuten.";
  }
  if(day===4){
    var sw=W.satz.toLowerCase().replace(/[.,!?]/g,"").split(/\s+/);
    var aw=aL.replace(/[.,!?]/g,"").split(/\s+/);
    var fehl=0;sw.forEach(function(x,i){if(aw[i]!==x)fehl++;});
    var proz=Math.round((1-fehl/sw.length)*100);
    if(fehl===0)return "Fantastisch"+vn+"! 🏆 Du hast den Satz vollständig und fehlerfrei aus dem Gedächtnis aufgeschrieben!";
    if(fehl<=2)return lob+" Fast perfekt – "+proz+"% stimmt! Vergleiche mit dem Satz oben.";
    if(fehl<=4)return "Gut"+vn+"! "+proz+"% richtig. Finde die Unterschiede zum Satz oben.";
    return "Du hast es versucht"+vn+"! "+proz+"% stimmt. Vergleiche Wort für Wort mit dem Satz oben.";
  }
  return "";
}

// ── STEMPEL LADEN ─────────────────────────────────────────────────────────
async function loadStempel(tag,boxEl){
  var name=document.getElementById("name-input").value.trim();
  if(!name||!SCRIPT_URL)return;
  try{
    var url=SCRIPT_URL+"?action=getStempel&name="+encodeURIComponent(name)+"&tag="+encodeURIComponent(tag);
    var resp=await fetch(url);
    var text=await resp.text();
    if(text&&text.trim()&&text.trim()!=="ok"&&text.trim()!==""){
      boxEl.className="stempel-box vis";
      boxEl.querySelector(".stempel-text").textContent=text.trim();
    }
  }catch(e){}
}

// ── SHEETS SPEICHERN ──────────────────────────────────────────────────────
function saveToSheets(name,tag,antwort,feedback){
  if(!SCRIPT_URL)return;
  fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"saveAntwort",name:name,tag:tag,kw:W?W.kw:"",woche:"",antwort:antwort,feedback:feedback})
  }).catch(function(){});
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll(){
  if(!W)return;
  // Banner
  document.getElementById("kw-badge").textContent="📅 KW "+W.kw;
  document.getElementById("chip-wort").textContent=W.wort;
  document.getElementById("chip-art").textContent=W.art;
  var el=document.getElementById("banner-satz");
  var esc=W.wort.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  var html="«"+W.satz.replace(new RegExp("("+esc+")","gi"),'<span class="zw">$1</span>')+"»";
  if(html==="«"+W.satz+"»")html="«"+W.satz+"» <span style='font-size:11px;color:var(--muted)'>(Zielwort: <strong>"+W.wort+"</strong>)</span>";
  el.innerHTML=html;
  renderTabs();
  renderCard();
}

function renderTabs(){
  var el=document.getElementById("day-tabs");el.innerHTML="";
  DN.forEach(function(n,i){
    var b=document.createElement("button");
    b.className="day-tab"+(i===currentDay?" active":"");
    b.dataset.d=i;b.textContent=n;b.onclick=function(){switchDay(i);};
    el.appendChild(b);
  });
}

function renderCard(){
  if(!W)return;
  var d=currentDay;
  document.getElementById("task-card").className="task-card day-"+d;
  document.getElementById("card-emoji").textContent=DE[d];
  var titles=["Wort kennenlernen","Eigener Satz","Grammatik","Wortfamilie","Ich erinnere mich"];
  var subs=["Lies die Definition und beantworte die Fragen.","Benutze das Zielwort in einem eigenen Satz.","Grammatik-Aufgabe zum Zielwort.","Verwandte Wörter entdecken.","Schreibe den Satz aus dem Gedächtnis."];
  document.getElementById("card-title").textContent=titles[d];
  document.getElementById("card-sub").textContent=subs[d];
  var body=document.getElementById("card-body");body.innerHTML="";

  // Stempel Di–Fr
  if(d>0){
    var stBox=document.createElement("div");
    stBox.className="stempel-box";
    stBox.innerHTML="<div class='stempel-label'>✏️ Rückmeldung der Lehrperson</div><div class='stempel-text'></div>";
    body.appendChild(stBox);
    loadStempel(DN[d],stBox);
  }

  if(d===0){
    // MONTAG: Definition + MC
    if(W.def){
      var defBox=document.createElement("div");defBox.className="def-box";
      defBox.innerHTML="<div class='def-label'>📖 Was bedeutet «"+W.wort+"»?</div><div>"+W.def.replace(/\n/g,"<br>")+"</div>";
      body.appendChild(defBox);
    }
    // MC
    var mcSec=document.createElement("div");mcSec.className="mc-section";
    var hasMC=false;
    [W.mc1,W.mc2].forEach(function(q,qi){
      if(!q||!q.q)return;
      hasMC=true;
      var qDiv=document.createElement("div");qDiv.className="mc-q";
      var qText=document.createElement("div");qText.className="mc-q-text";
      qText.textContent=(qi+1)+". "+q.q;qDiv.appendChild(qText);
      var optsDiv=document.createElement("div");optsDiv.className="mc-opts";
      var resDiv=document.createElement("div");resDiv.className="mc-result";
      q.opts.forEach(function(opt,oi){
        if(!opt)return;
        var btn=document.createElement("button");btn.className="mc-opt-btn";btn.textContent=opt;
        btn.onclick=function(){
          optsDiv.querySelectorAll(".mc-opt-btn").forEach(function(b){b.disabled=true;});
          if(oi===q.correct){
            btn.classList.add("correct");
            resDiv.textContent="✓ Richtig! 🌟";resDiv.style.color="var(--green)";
          } else {
            btn.classList.add("wrong");
            optsDiv.querySelectorAll(".mc-opt-btn")[q.correct].classList.add("correct");
            resDiv.textContent="Nicht ganz – die richtige Antwort ist markiert.";resDiv.style.color="var(--orange)";
          }
          resDiv.className="mc-result vis";
        };
        optsDiv.appendChild(btn);
      });
      qDiv.appendChild(optsDiv);qDiv.appendChild(resDiv);mcSec.appendChild(qDiv);
    });
    if(hasMC){
      var mcTitle=document.createElement("div");
      mcTitle.style.cssText="font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px";
      mcTitle.textContent="🎯 Teste dein Verständnis";
      mcSec.insertBefore(mcTitle,mcSec.firstChild);
      body.appendChild(mcSec);
    }
    // Fertig-Button
    var btnRow=document.createElement("div");btnRow.style.cssText="display:flex;align-items:center;gap:14px;flex-wrap:wrap";
    var btn=document.createElement("button");btn.className="submit-btn btn-0";btn.textContent="Fertig ✓";
    btn.onclick=function(){
      var name=document.getElementById("name-input").value.trim();
      if(!name){alert("Bitte trage zuerst deinen Namen ein.");return;}
      btn.disabled=true;btn.textContent="Gespeichert ✓";
      saveToSheets(name,"Montag","Definition & Quiz abgeschlossen","—");
      var sn=document.createElement("span");sn.style.cssText="font-size:12px;color:var(--green);font-weight:600";
      sn.textContent="✅ Gespeichert";btnRow.appendChild(sn);
    };
    btnRow.appendChild(btn);body.appendChild(btnRow);

  } else {
    // DI–FR
    var prompts={
      1:"Schreibe einen eigenen Satz mit dem Wort «"+W.wort+"».\nDu darfst die Form des Wortes verändern.",
      2:W.art==="Verb"?"Konjugiere das Verb «"+W.wort+"» im Präsens:\nych __ / du __ / er/sie __ / wir __ / ihr __ / sie __":W.art==="Adjektiv"?"Steigere das Adjektiv «"+W.wort+"»:\nGrundform: __ / Komparativ: __ / Superlativ: am __":"Bilde den Plural von «"+W.wort+"».\nSchreibe dann einen Satz mit dem Plural.",
      3:"Schreibe 1–2 Wörter, die mit «"+W.wort+"» verwandt sind.\nErkläre kurz, was sie bedeuten.",
      4:"Schreibe den Satz dieser Woche aus dem Gedächtnis.\nOhne nachzuschauen!"
    };
    var hints={
      1:"Tipp: Schau, wie das Wort im Modellsatz steht.",
      2:W.art==="Verb"?"Schau im Wörterbuch nach, wenn du nicht sicher bist.":W.art==="Adjektiv"?"Beispiel: schnell → schneller → am schnellsten":"Beispiel: die Hand → die Hände",
      3:"Beispiel: Wort → verwandtes Wort (= kurze Erklärung)",
      4:"Vergleiche danach mit dem Satz oben. Alles richtig? ✓"
    };
    var ph={1:"Mein Satz: ...",2:"Deine Antwort...",3:"Verwandte Wörter...",4:"Schreibe den Satz aus dem Gedächtnis..."};

    var pEl=document.createElement("div");pEl.className="task-prompt";pEl.textContent=prompts[d];body.appendChild(pEl);
    var hEl=document.createElement("div");hEl.className="task-hint";hEl.textContent=hints[d];body.appendChild(hEl);

    if(d===4){
      var blEl=document.createElement("div");blEl.className="friday-blank";
      var blanked=W.satz.replace(new RegExp(W.wort,"gi"),"_".repeat(W.wort.length));
      blEl.textContent="«"+blanked+"»";body.appendChild(blEl);
    }

    var ta=document.createElement("textarea");ta.id="answer-input";ta.placeholder=ph[d];body.appendChild(ta);

    var btnRow2=document.createElement("div");btnRow2.style.cssText="display:flex;align-items:center;gap:14px;flex-wrap:wrap";
    var btn2=document.createElement("button");btn2.className="submit-btn btn-"+d;
    btn2.textContent="Fertig – Rückmeldung holen ✓";
    btn2.onclick=function(){
      var ans=document.getElementById("answer-input").value.trim();
      if(!ans){alert("Bitte schreibe zuerst deine Antwort.");return;}
      var name=document.getElementById("name-input").value.trim();
      if(!name){alert("Bitte trage zuerst deinen Namen ein.");return;}
      btn2.disabled=true;
      var fbT=getRuleFeedback(d,ans);
      var fbBox=document.getElementById("fb-box");
      if(fbBox){fbBox.className="fb-box fb-"+d+" vis";document.getElementById("fb-text").textContent=fbT;}
      btn2.textContent="Nochmals versuchen";btn2.disabled=false;
      saveToSheets(name,DN[d],ans,fbT);
      setTimeout(function(){var sn=document.getElementById("saved-note");if(sn)sn.className="saved-note vis";},800);
    };
    btnRow2.appendChild(btn2);
    var snEl=document.createElement("span");snEl.id="saved-note";snEl.className="saved-note";snEl.textContent="✅ Gespeichert";
    btnRow2.appendChild(snEl);body.appendChild(btnRow2);

    var fbBox=document.createElement("div");fbBox.id="fb-box";fbBox.className="fb-box fb-"+d;
    fbBox.innerHTML="<div class='fb-label'>Rückmeldung</div><div id='fb-text'></div>";
    body.appendChild(fbBox);
  }
}

function switchDay(d){currentDay=d;renderTabs();renderCard();}
function toggleT(){document.getElementById("tp-form").classList.toggle("open");}
function saveT(){
  SCRIPT_URL=document.getElementById("t-script").value.trim();
  try{localStorage.setItem("sdw_script",SCRIPT_URL);}catch(e){}
  toggleT();
  W=null;loadWoche();
}

// Init
try{var sc=localStorage.getItem("sdw_script");if(sc)SCRIPT_URL=sc;document.getElementById("t-script").value=SCRIPT_URL;}catch(e){}
try{var name=localStorage.getItem("sdw_name")||"";document.getElementById("name-input").value=name;
document.getElementById("name-input").addEventListener("change",function(){localStorage.setItem("sdw_name",this.value);});}catch(e){}
currentDay=autoDay();
loadWoche();
</script>
